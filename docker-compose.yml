services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: cookbook
      POSTGRES_PASSWORD: cookbook
      POSTGRES_DB: cookbook
    ports:
      # Host port; set POSTGRES_PORT if 5432 is already taken by a local Postgres.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cookbook -d cookbook']
      interval: 3s
      timeout: 3s
      retries: 20
  # Local S3-compatible storage for photos (used from Sprint 2, BE-05). The MinIO image this file
  # used before can no longer be pulled from Docker Hub (docs/DECISIONS.md D-016). SeaweedFS 4.48,
  # pinned by digest so it cannot change underneath us. Credentials are fake, local-only values.
  s3:
    image: chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    # volume.max: SeaweedFS reserves 7 storage volumes per bucket and allows 8 by default, so a second
    # bucket (for example the test bucket) would find no space. Volumes grow as needed (no preallocation).
    command: server -dir=/data -volume.max=100 -master.volumeSizeLimitMB=1024 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - '${S3_PORT:-8333}:8333'
    volumes:
      - s3data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
volumes:
  pgdata:
  s3data:
